name: Web Monitor

on:
  schedule:
    # 정각(00, 15, 30, 45) 대신 5분 단위(05, 20, 35, 50)로 비켜서 설정
    # KST 09:05 ~ 19:05 매 15분마다 실행 (UTC 00:05 ~ 10:05)
    - cron: '5/15 0-10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Run Monitoring Script
      env:
        TARGET_URL: ${{ secrets.TARGET_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
      run: python monitor.py

    - name: Commit and Push Log Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_log.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update sent_log.json" && git push)
