name: Web Monitor

on:
  schedule:
    # 30분마다 실행
    - cron: '*/20 * * * *'
  workflow_dispatch: # 수동 실행 버튼

# 레포지토리에 변경된 sent_log.json을 커밋할 수 있는 권한 부여
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Run Monitoring Script
      env:
        TARGET_URL: ${{ secrets.TARGET_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
      run: python monitor.py

    # sent_log.json 파일이 변경되었으면 레포지토리에 자동 Push
    - name: Commit and Push Log Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_log.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update sent_log.json" && git push)
