name: Web Monitor

on:
  schedule:
    # KST 09:20, 09:35, 09:50 (UTC 00:20, 00:35, 00:50)
    - cron: '20,35,50 0 * * *'
    # KST 10:00 ~ 19:00 매 15분마다 (UTC 01:00 ~ 10:00)
    - cron: '*/15 1-10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
    - name: Repository Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pytz

    - name: Run Monitoring Script
      env:
        TARGET_URL: ${{ secrets.TARGET_URL }}
        EMAIL_USER: ${{ secrets.EMAIL_USER }}
        EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
      run: python monitor.py

    - name: Commit and Push Log Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add sent_log.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: Update sent_log.json" && git push)
